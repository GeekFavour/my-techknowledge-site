{% extends "base.html" %}

{% block site_meta %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  {% if page.meta and page.meta.description %}
    <meta name="description" content="{{ page.meta.description }}">
  {% elif config.site_description %}
    <meta name="description" content="{{ config.site_description }}">
  {% endif %}
  {% if page.meta and page.meta.author %}
    <meta name="author" content="{{ page.meta.author }}">
  {% elif config.site_author %}
    <meta name="author" content="{{ config.site_author }}">
  {% endif %}
  {% if page.canonical_url %}
    <link rel="canonical" href="{{ page.canonical_url }}">
  {% endif %}
  <link rel="icon" href="{{ config.theme.favicon | url }}">
  <!-- GeekFavour Custom Metadata -->
  <meta name="theme-color" content="#090d16">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GeekFavour">
  <meta property="og:title" content="{% if page.title and not page.is_homepage %}{{ page.title }} — {% endif %}{{ config.site_name }}">
  <meta property="og:description" content="{% if page.meta and page.meta.description %}{{ page.meta.description }}{% else %}{{ config.site_description }}{% endif %}">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title and not page.is_homepage %}{{ page.title }} — {% endif %}{{ config.site_name }}">
  <meta name="twitter:description" content="{% if page.meta and page.meta.description %}{{ page.meta.description }}{% else %}{{ config.site_description }}{% endif %}">
{% endblock %}
